// NameBanner loads this file automatically on startup.

// Name changes within the rolling window that trigger a ban.
nb_namechanger_threshold 5

// Size of the rolling window, in seconds.
nb_namechanger_window 60.0

// Command run to ban a player once the threshold is hit.
// Placeholders: {steamid64}, {userid}, {changes}.
// The default requires a ban plugin that provides css_addban (e.g. SourceMod + basebans/SourceBans++).
// If you only run Metamod without SourceMod, replace this with your engine's own ban command instead.
nb_ban_command "css_addban {steamid64} 0 NameBanner: changed name {changes} times in under a minute"
