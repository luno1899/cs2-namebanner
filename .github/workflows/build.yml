name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows x64
        shell: pwsh
        run: ./build-windows.ps1 -BuildDirectory build-windows-ci
      - name: Package Windows x64
        shell: pwsh
        run: Compress-Archive -Path build-windows-ci/package/game -DestinationPath namebanner-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: namebanner-windows-x64
          path: namebanner-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Linux SteamRT3 x64
        run: ./build-linux.sh build-linux-ci
      - name: Package Linux x64
        run: cd build-linux-ci/package && zip -qr ../../namebanner-linux-x64.zip game
      - uses: actions/upload-artifact@v4
        with:
          name: namebanner-linux-x64
          path: namebanner-linux-x64.zip
          if-no-files-found: error
